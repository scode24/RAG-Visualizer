version: '3.8'

services:
  rag-visualizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-visualizer-app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

